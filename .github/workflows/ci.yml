name: CI

# Pull requests only. Pushes to main are handled by Release, which runs the same
# build and tests before it ships anything — running both would just duplicate
# the work on every merge.
on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # macos-26, not macos-15. The app targets Liquid Glass APIs that do not
    # exist in Xcode 16, and GitHub ships one major Xcode per macOS image —
    # so there is deliberately no xcode-select step here.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: |
          xcodebuild -scheme GoodeMormingPages \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            -quiet build

      - name: Test
        run: |
          xcodebuild -scheme GoodeMormingPages \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            -quiet test

      - name: Release build and launch check
        run: |
          # The one failure this repo has actually shipped: a Debug build that
          # passes everything, and a Release build that dies at launch because
          # ad-hoc signing plus the hardened runtime blocks loading Sparkle.
          # Catching it here means it never reaches a release.
          xcodebuild -scheme GoodeMormingPages \
            -configuration Release \
            -derivedDataPath build \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            -quiet build

          APP="build/Build/Products/Release/GoodeMormingPages.app"
          codesign -d --entitlements - "$APP" 2>&1 \
            | grep -q "disable-library-validation" \
            || { echo "::error::library validation is on; the app will not load Sparkle"; exit 1; }

          "$APP/Contents/MacOS/GoodeMormingPages" > /tmp/smoke.log 2>&1 &
          PID=$!
          sleep 5
          kill $PID 2>/dev/null || true

          if grep -q "Library not loaded\|different Team IDs" /tmp/smoke.log; then
            echo "::error::the app fails to load its frameworks"
            cat /tmp/smoke.log
            exit 1
          fi
          echo "launched past dyld cleanly"
