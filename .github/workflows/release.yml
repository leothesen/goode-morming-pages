name: Release

on:
  # Fires when you publish a release in the GitHub UI, which is the whole point.
  # WalkingPad triggers on `push: tags`, which does *not* reliably run when a
  # release is created through the web interface.
  release:
    types: [published]

  # Manual re-run for an existing tag, e.g. when a release job failed halfway.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then echo "::error::no tag resolved"; exit 1; fi
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Stamp version from the tag
        run: |
          V="${{ steps.tag.outputs.version }}"
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $V;/g" \
            GoodeMormingPages.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $V;/g" \
            GoodeMormingPages.xcodeproj/project.pbxproj
          grep -m1 "MARKETING_VERSION" GoodeMormingPages.xcodeproj/project.pbxproj

      - name: Build (Release)
        run: |
          xcodebuild -scheme GoodeMormingPages \
            -configuration Release \
            -derivedDataPath build \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            -quiet build

      - name: Package
        run: |
          mkdir -p assets
          # ditto, not zip: it preserves the bundle's symlinks and metadata,
          # which Sparkle needs intact to validate and install the update.
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/GoodeMormingPages.app" \
            "assets/GoodeMormingPages.zip"
          ls -la assets

      - name: Fetch Sparkle tools
        run: |
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz" \
            -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle
          tar xJf /tmp/sparkle.tar.xz -C /tmp/sparkle

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — the appcast would be unsigned and every client would reject the update."
            exit 1
          fi

          KEY_FILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"

          # generate_appcast reads the version out of the built bundle, signs the
          # archive, and writes correct enclosure lengths — all the things that
          # go subtly wrong when the XML is assembled by hand.
          /tmp/sparkle/bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/" \
            --link "https://github.com/${{ github.repository }}" \
            -o appcast.xml \
            assets/

          rm -f "$KEY_FILE"
          echo "--- appcast.xml ---"
          cat appcast.xml

      - name: Upload the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            assets/GoodeMormingPages.zip --clobber

      - name: Publish appcast to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp appcast.xml /tmp/appcast.xml

          # Drop the build-time version stamp before switching branches.
          git checkout -- .
          git fetch origin main
          git checkout main

          cp /tmp/appcast.xml appcast.xml
          V="${{ steps.tag.outputs.version }}"
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $V/" project.yml
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $V;/g" \
            GoodeMormingPages.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $V/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $V;/g" \
            GoodeMormingPages.xcodeproj/project.pbxproj

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml project.yml GoodeMormingPages.xcodeproj/project.pbxproj

          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "chore: appcast and version for ${{ steps.tag.outputs.tag }}"
            git push origin main
          fi

      - name: Confirm the feed is actually reachable
        run: |
          # The failure this guards against is silent: Sparkle treats a 404 feed
          # as "no update available" and never tells the user anything.
          URL="https://raw.githubusercontent.com/${{ github.repository }}/main/appcast.xml"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/feed.xml -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "feed reachable"
              grep -q "sparkle:edSignature" /tmp/feed.xml \
                && echo "feed is signed" \
                || { echo "::error::feed has no signature"; exit 1; }
              exit 0
            fi
            echo "attempt $i: HTTP $CODE, waiting for raw CDN"
            sleep 10
          done
          echo "::error::appcast not reachable at $URL"
          exit 1
