name: Release

# Publishing a release ships it. Nothing happens on merge.
on:
  release:
    types: [published]

  # Re-run a release whose job failed partway.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then echo "::error::no tag resolved"; exit 1; fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Stamp the version from the tag
        run: |
          V="${{ steps.tag.outputs.version }}"
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $V;/g" \
            GoodeMormingPages.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $V;/g" \
            GoodeMormingPages.xcodeproj/project.pbxproj
          grep -m1 "MARKETING_VERSION" GoodeMormingPages.xcodeproj/project.pbxproj

      - name: Test
        run: |
          xcodebuild -scheme GoodeMormingPages \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            -quiet test

      - name: Build (Release)
        run: |
          xcodebuild -scheme GoodeMormingPages \
            -configuration Release \
            -derivedDataPath build \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            -quiet build

      - name: Smoke test — does it actually launch?
        run: |
          APP="build/Build/Products/Release/GoodeMormingPages.app"

          # "BUILD SUCCEEDED" says nothing about whether the thing runs. v0.1.1
          # built, signed, published — and died at launch because ad-hoc signing
          # plus the hardened runtime blocks loading Sparkle.framework.
          codesign -d --entitlements - "$APP" 2>&1 \
            | grep -q "disable-library-validation" \
            || { echo "::error::library validation is on; the app will not load Sparkle"; exit 1; }

          "$APP/Contents/MacOS/GoodeMormingPages" > /tmp/smoke.log 2>&1 &
          PID=$!
          sleep 5
          kill $PID 2>/dev/null || true

          if grep -q "Library not loaded\|different Team IDs" /tmp/smoke.log; then
            echo "::error::the app fails to load its frameworks"
            cat /tmp/smoke.log
            exit 1
          fi
          echo "launched past dyld cleanly"

      - name: Package
        run: |
          mkdir -p assets
          # ditto, not zip: it preserves the bundle's symlinks and metadata,
          # which Sparkle needs intact to validate and install the update.
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/GoodeMormingPages.app" \
            "assets/GoodeMormingPages.zip"

      - name: Fetch Sparkle tools
        run: |
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz" \
            -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle
          tar xJf /tmp/sparkle.tar.xz -C /tmp/sparkle

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set — the appcast would be unsigned and every client would reject the update."
            exit 1
          fi

          KEY_FILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"

          # generate_appcast reads the version out of the built bundle, signs the
          # archive, and writes correct enclosure lengths — all the things that
          # go subtly wrong when the XML is assembled by hand.
          /tmp/sparkle/bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/" \
            --link "https://github.com/${{ github.repository }}" \
            -o appcast.xml \
            assets/

          rm -f "$KEY_FILE"
          cat appcast.xml

      - name: Attach the app and the feed to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The appcast ships as a release asset rather than a commit on main.
          #
          # Committing it back to main fought branch protection: the bot is not
          # exempt from "changes must be made through a pull request", so the
          # push was rejected, the release looked fine, and the update feed
          # silently stopped advancing. Serving it from
          # releases/latest/download/ is a permanently stable URL that needs no
          # write access to any branch.
          gh release upload "${{ steps.tag.outputs.tag }}" \
            assets/GoodeMormingPages.zip \
            appcast.xml \
            --clobber

      - name: Confirm the feed is live and signed
        run: |
          # The failure this guards against is silent: Sparkle treats an
          # unreachable feed as "no update available" and says nothing.
          URL="https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml"
          V="${{ steps.tag.outputs.version }}"

          for i in 1 2 3 4 5; do
            CODE=$(curl -sL -o /tmp/feed.xml -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ] && grep -q "$V" /tmp/feed.xml; then
              grep -q "sparkle:edSignature" /tmp/feed.xml \
                && { echo "feed is live, signed, and advertises $V"; exit 0; } \
                || { echo "::error::feed has no signature"; exit 1; }
            fi
            echo "attempt $i: HTTP $CODE"
            sleep 10
          done
          echo "::error::feed did not resolve to $V at $URL"
          cat /tmp/feed.xml || true
          exit 1
