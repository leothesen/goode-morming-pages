<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Goode Morming Pages.

    Source artwork for the app icon. Palette is the app's own: Ensō's parchment
    and charcoal, with the cinnabar accent used for the seal — the colour
    traditionally stamped beside ink brushwork.

    Drawn on the macOS convention of a squircle inset from the full canvas
    rather than bleeding to the edges.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#EFE6D3"/>
    </linearGradient>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2A28"/>
      <stop offset="55%" stop-color="#3A3733"/>
      <stop offset="100%" stop-color="#57493C"/>
    </linearGradient>

    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4D9C4"/>
    </linearGradient>

    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A453E"/>
      <stop offset="100%" stop-color="#241F1B"/>
    </linearGradient>

    <!--
      macOS corner radius is ~22.37% of the tile, which a plain rounded rect
      gets right. A hand-rolled cubic path reads as a lumpy blob at large sizes.
    -->
    <clipPath id="tile">
      <rect x="96" y="96" width="832" height="832" rx="186" ry="186"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <g clip-path="url(#tile)">
    <rect x="96" y="96" width="832" height="832" fill="url(#sky)"/>

    <!-- Sunrise: the morning in morning pages -->
    <circle cx="512" cy="470" r="150" fill="#C1272D" opacity="0.20"/>
    <circle cx="512" cy="470" r="104" fill="#D8552F" opacity="0.30"/>

    <!-- Open book, seen slightly from above -->
    <g>
      <!-- left page -->
      <path d="M 512 566
               C 440 512 350 494 246 502
               L 246 760
               C 350 752 440 770 512 824 Z"
            fill="url(#paper)"/>
      <!-- right page -->
      <path d="M 512 566
               C 584 512 674 494 778 502
               L 778 760
               C 674 752 584 770 512 824 Z"
            fill="url(#paper)"/>
      <!-- spine shadow -->
      <path d="M 512 566 L 512 824" stroke="#C9BCA3" stroke-width="10" fill="none" opacity="0.7"/>

      <!-- written lines, fading upward the way the app's text does -->
      <g stroke="#8C8377" stroke-linecap="round" fill="none">
        <path d="M 300 566 L 462 588" stroke-width="12" opacity="0.25"/>
        <path d="M 300 620 L 462 642" stroke-width="12" opacity="0.45"/>
        <path d="M 300 674 L 462 696" stroke-width="12" opacity="0.65"/>
        <path d="M 300 728 L 400 748" stroke-width="12" opacity="0.85"/>

        <path d="M 562 588 L 724 566" stroke-width="12" opacity="0.25"/>
        <path d="M 562 642 L 724 620" stroke-width="12" opacity="0.45"/>
        <path d="M 562 696 L 724 674" stroke-width="12" opacity="0.65"/>
        <path d="M 562 748 L 662 728" stroke-width="12" opacity="0.85"/>
      </g>
    </g>

    <!-- Coffee, left -->
    <g transform="translate(232 300)">
      <!-- steam -->
      <g stroke="#E8DCC6" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.55">
        <path d="M 52 -6 C 34 -34 74 -52 56 -84"/>
        <path d="M 104 -6 C 86 -34 126 -52 108 -84"/>
      </g>
      <!-- handle -->
      <path d="M 168 54 C 214 46 218 122 168 116"
            stroke="#E4D9C4" stroke-width="22" fill="none" stroke-linecap="round"/>
      <!-- cup -->
      <path d="M 8 26 L 172 26 L 158 150 C 156 172 138 186 116 186 L 64 186
               C 42 186 24 172 22 150 Z"
            fill="url(#cup)"/>
      <!-- coffee surface -->
      <ellipse cx="90" cy="30" rx="80" ry="15" fill="#4A3628"/>
      <ellipse cx="90" cy="30" rx="66" ry="10" fill="#6B4A32"/>
    </g>

    <!-- Fountain pen, right, resting across the page -->
    <g transform="translate(700 286) rotate(34)">
      <!-- barrel -->
      <rect x="0" y="0" width="52" height="250" rx="26" fill="url(#pen)"/>
      <!-- grip band, cinnabar -->
      <rect x="0" y="196" width="52" height="26" fill="#C1272D"/>
      <!-- nib -->
      <path d="M 4 244 L 48 244 L 26 322 Z" fill="#D9C68A"/>
      <path d="M 26 262 L 26 306" stroke="#8A7742" stroke-width="7" stroke-linecap="round"/>
      <!-- cap finial -->
      <rect x="10" y="-14" width="32" height="18" rx="9" fill="#C1272D"/>
    </g>

  </g>
</svg>
