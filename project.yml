name: GoodeMormingPages

options:
  bundleIdPrefix: co.leothesen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  GoodeMormingPages:
    type: application
    platform: macOS
    sources:
      - path: GoodeMormingPages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.leothesen.GoodeMormingPages
        # Deliberately spaceless. The pretty name lives in CFBundleDisplayName,
        # which is what Finder and the menu bar actually show. A product name
        # with spaces means quoting every path in CI and a mangled module name.
        PRODUCT_NAME: GoodeMormingPages
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: GoodeMormingPages/Info.plist
      properties:
        CFBundleName: Goode Morming Pages
        CFBundleDisplayName: Goode Morming Pages
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        ATSApplicationFontsPath: Fonts

  GoodeMormingPagesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GoodeMormingPagesTests
    dependencies:
      - target: GoodeMormingPages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.leothesen.GoodeMormingPagesTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GoodeMormingPages:
    build:
      targets:
        GoodeMormingPages: all
        GoodeMormingPagesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GoodeMormingPagesTests
    archive:
      config: Release
