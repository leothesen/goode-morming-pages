name: GoodeMormingPages

options:
  bundleIdPrefix: co.leothesen
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.3
    # Deliberately the same semver string, not a bare integer. Sparkle compares
    # CFBundleVersion to decide whether an update is newer — and with a baseline
    # of "1", a released "0.1.1" reads as OLDER and is silently never offered.
    CURRENT_PROJECT_VERSION: 0.1.3
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing plus an embedded framework needs library validation off, or
    # the app dies at launch before drawing anything. See the entitlements file.
    CODE_SIGN_ENTITLEMENTS: GoodeMormingPages/GoodeMormingPages.entitlements
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6

targets:
  GoodeMormingPages:
    type: application
    platform: macOS
    sources:
      - path: GoodeMormingPages
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.leothesen.GoodeMormingPages
        # Deliberately spaceless. The pretty name lives in CFBundleDisplayName,
        # which is what Finder and the menu bar actually show. A product name
        # with spaces means quoting every path in CI and a mangled module name.
        PRODUCT_NAME: GoodeMormingPages
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: GoodeMormingPages/Info.plist
      properties:
        CFBundleName: Goode Morming Pages
        CFBundleDisplayName: Goode Morming Pages
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        ATSApplicationFontsPath: Fonts

        # Sparkle. The feed is a plain unauthenticated URL, which only works
        # because this repo is public — a private repo 404s here and Sparkle
        # treats a failed feed fetch as "no update available", silently.
        SUFeedURL: https://raw.githubusercontent.com/leothesen/goode-morming-pages/main/appcast.xml
        SUPublicEDKey: iIiC1hCpKxreAP1k91BU66Buf4k2HNK7p8WyJuKM/vc=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true

  GoodeMormingPagesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GoodeMormingPagesTests
    dependencies:
      - target: GoodeMormingPages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.leothesen.GoodeMormingPagesTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GoodeMormingPages:
    build:
      targets:
        GoodeMormingPages: all
        GoodeMormingPagesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GoodeMormingPagesTests
    archive:
      config: Release
